name: Twice-weekly AI paper brief

on:
  schedule:
    # 08:17 Beijing, Monday/Thursday; next-day retries skip published issues.
    - cron: "17 0 * * 1,2,4,5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper_spider/**'
      - 'tests/**'
      - 'config.toml'
      - '.github/workflows/twice-weekly-report.yml'

permissions:
  contents: write

concurrency:
  group: paper-brief-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test pipeline
        run: python -m unittest discover -s tests -v
      - name: Generate brief
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python -u -m paper_spider --scheduled
      - name: Preserve reports
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-brief-${{ github.run_id }}
          path: reports/*.md
          retention-days: 30
      - name: Publish run summary
        run: |
          latest=$(find reports -maxdepth 1 -name '*.md' | sort | tail -1)
          if [ -n "$latest" ]; then cat "$latest" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/seen.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: add AI paper brief"
          git pull --rebase origin main
          git push origin HEAD:main
